<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keputusan & Carta Kejohanan — Paparan Pemain</title>
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{
  --bg:#eef3f8;
  --card:#ffffff;
  --ink:#172033;
  --muted:#6b778c;
  --primary:#1769e0;
  --primary2:#0d47a1;
  --success:#0b9f6e;
  --gold:#f59e0b;
  --border:#dfe6ef;
  --shadow:0 14px 40px rgba(25,45,75,.10);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 0%,rgba(23,105,224,.12),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(11,159,110,.10),transparent 25%),
    var(--bg);
  padding:20px 14px 50px;
}
.container{
  width:min(1000px,100%);
  margin:0 auto;
}
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.top-bar h1{
  margin:0;
  font-size:22px;
  color:var(--primary2);
}
.live-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:700;
  color:var(--success);
  background:rgba(11,159,110,.10);
  border:1px solid rgba(11,159,110,.3);
  padding:5px 10px;
  border-radius:999px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--success);
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
.updated-txt{font-size:11.5px;color:var(--muted)}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:18px 18px 20px;
  margin-bottom:18px;
}
.panel h2{
  margin:0 0 12px;
  font-size:16px;
  color:var(--ink);
}
.empty-msg{
  color:var(--muted);
  font-size:14px;
  text-align:center;
  padding:20px 10px;
}
.group-container{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.group-card{
  background:#fbfcff;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
}
.group-card b{color:var(--primary2);display:block;margin-bottom:8px}
ol.numbered-list{padding-left:0;list-style:none;margin:0}
ol.numbered-list li{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:7px;
  font-size:14px;
}
.pos-badge{
  flex:0 0 auto;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  font-size:12px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
li.medal-1 .pos-badge{background:#f5b63b}
li.medal-2 .pos-badge{background:#9aa7b8}
li.medal-3 .pos-badge{background:#c17a45}
li.medal-4 .pos-badge{background:#5c8fd6}
li.eliminated{opacity:.5;text-decoration:line-through}
.medal-icon{font-size:14px}
.q-list{list-style:none;padding:0;margin:0}
.q-list li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 4px;
  border-bottom:1px dashed var(--border);
  font-size:14px;
}
.q-list li:last-child{border-bottom:none}
.q-tag{color:var(--muted);font-size:12.5px}

/* Bracket (read-only) */
.bracket-box{
  background:linear-gradient(135deg,#0d1830,#1b2f52);
  padding:22px 20px;
  border-radius:16px;
  color:#f5f8ff;
  overflow-x:auto;
  border:1px solid rgba(255,255,255,.08);
}
.champion-banner{
  margin-bottom:16px;
  text-align:center;
  font-size:16px;
  font-weight:800;
  color:#7a4a00;
  background:linear-gradient(135deg,#ffe9b8,#ffd98a);
  border:1px solid #f0c470;
  border-radius:12px;
  padding:14px;
}
.bracket-stage{margin-bottom:6px}
.bracket-stage-label{
  font-size:11px;
  font-weight:800;
  color:#8fa9d6;
  text-transform:uppercase;
  letter-spacing:.06em;
  text-align:center;
  margin-bottom:10px;
}
.bracket-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(110px,1fr));
  gap:10px;
}
.bracket-grid.cols-2{grid-template-columns:repeat(2,minmax(130px,1fr))}
.bracket-grid.cols-1{grid-template-columns:1fr;max-width:320px;margin:0 auto}
.bracket-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:10px 11px;
  font-size:12px;
  line-height:1.5;
}
.bracket-mini-label{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:#7d93bd;
  margin-bottom:3px;
}
.result-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  padding:5px 7px;
  border-radius:7px;
  margin-bottom:3px;
  background:rgba(255,255,255,.04);
}
.result-line.is-winner{
  background:rgba(11,159,110,.16);
  border:1px solid rgba(11,159,110,.4);
  font-weight:700;
  color:#c9ffe6;
}
.result-line.is-loser{opacity:.45;text-decoration:line-through}
.result-line.pending{opacity:.55;font-style:italic}
.win-check{font-size:11px}
.bracket-vs{
  text-align:center;
  font-size:10px;
  color:#7d93bd;
  margin:3px 0;
}
.bracket-card.final-card{
  max-width:320px;
  margin:0 auto;
  border-color:rgba(245,182,59,.4);
  background:linear-gradient(135deg,rgba(245,182,59,.14),rgba(255,255,255,.05));
}
.bracket-connector-svg{display:block;width:100%;height:34px;margin:-2px 0 2px}
.bracket-connector-svg path{stroke:#5f77a3;stroke-width:1.6;fill:none}
.bracket-heading{
  font-size:13px;
  font-weight:800;
  letter-spacing:.04em;
  color:#bcd0f5;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:18px;
}
.tree-scroll{overflow-x:auto;padding-bottom:6px}
.tree-wrap{position:relative;margin:0 auto}
.tree-col-label{
  position:absolute;
  top:0;
  font-size:11.5px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.tree-box{
  position:absolute;
  width:190px;
  height:32px;
  padding:0 10px;
  border:1.4px solid var(--border);
  border-radius:7px;
  background:#fff;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink);
  display:flex;
  align-items:center;
  box-sizing:border-box;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tree-box.pending{border-style:dashed;color:var(--muted);font-weight:500;background:#fbfcff}
.tree-box.winner{border-color:var(--success);background:rgba(11,159,110,.08);color:var(--success);font-weight:800}
.tree-box.loser{opacity:.45;text-decoration:line-through}
.tree-svg .tree-line{fill:none;stroke:var(--border);stroke-width:1.4px}
@media(max-width:650px){
  .group-container{grid-template-columns:1fr}
  .bracket-box{padding:16px 12px}
  .peserta-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media(min-width:651px) and (max-width:900px){
  .peserta-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}

/* Grid Senarai Peserta — 5 lajur */
.peserta-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
}
.peserta-card{
  background:#fbfcff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 8px;
  font-size:13px;
  font-weight:700;
  text-align:center;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:54px;
  word-break:break-word;
  line-height:1.35;
}
.peserta-num{
  color:var(--primary);
  font-weight:800;
  margin-right:4px;
}

/* Ticker skrol — pesanan pengurus perlawanan */
.ticker-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:46px;
  background:linear-gradient(90deg,var(--primary2),var(--primary));
  color:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  box-shadow:0 -4px 14px rgba(0,0,0,.18);
  z-index:50;
}
.ticker-track{
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  font-weight:700;
  font-size:15px;
  letter-spacing:.02em;
  animation:tickerScroll linear infinite;
}
@keyframes tickerScroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}
body.has-ticker{padding-bottom:66px;}
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1 id="mainTitle">🏓 Keputusan & Carta Kejohanan</h1>
        <div>
            <span class="live-badge"><span class="live-dot"></span> LIVE</span>
            <div class="updated-txt" id="sourceTxt"></div>
            <div class="updated-txt" id="updatedTxt"></div>
        </div>
    </div>

    <div class="panel" id="pesertaPanel" style="display:none;">
        <h2>👥 Senarai Peserta Berdaftar</h2>
        <div id="pesertaArea"></div>
    </div>

    <div class="panel" id="groupPanel" style="display:none;">
        <h2>🎲 Pecahan Kumpulan</h2>
        <div id="groupArea"></div>
    </div>

    <div class="panel" id="slotPanel" style="display:none;">
        <h2>🏆 Penempatan Juara ke Suku Akhir</h2>
        <div id="slotArea"></div>
    </div>

    <div class="panel" id="bracketPanel" style="display:none;">
        <h2>📊 Carta Draw Sheet — Peringkat Kalah Mati</h2>
        <div id="bracketArea"></div>
    </div>
</div>

<div class="ticker-wrap" id="tickerWrap" style="display:none;">
    <div class="ticker-track" id="tickerTrack"></div>
</div>


<script>
// Ganti URL bawah dengan "Web app URL" yang sama seperti dalam undi.html.
const API_URL = "https://script.google.com/macros/s/AKfycbwk6IQCYNyNhfPIdMgsoFlUEYflFmXicq8zDPbJif5xkDXREoQZqgP2xMLliPy_82W27Q/exec";

function apiReady() {
    return API_URL && API_URL.startsWith("http");
}

async function fetchState() {
    if (apiReady()) {
        try {
            let res = await fetch(API_URL, { cache: "no-store" });
            let data = await res.json();
            document.getElementById("sourceTxt").innerText = "🌐 Live dari Server";
            return {
                title: data.kbttc_undian_title || "",
                announcement: data.kbttc_undian_announcement || "",
                mode: data.kbttc_undian_mode || "4",
                qualifyCount: data.kbttc_undian_qualifycount || "3",
                peserta: data.kbttc_undian_peserta || [],
                groups: data.kbttc_undian_groups || {},
                ranks: data.kbttc_undian_ranks || {},
                slotJuara: data.kbttc_undian_slotjuara || {},
                p16draw: data.kbttc_undian_p16 || null,
                p16full: data.kbttc_undian_p16full || null,
                qf2draw: data.kbttc_undian_qf2 || null,
                matches: data.kbttc_undian_matches || {}
            };
        } catch (err) {
            console.warn("Gagal hubungi Google Sheet, guna simpanan tempatan:", err);
        }
    }
    document.getElementById("sourceTxt").innerText = "📴 Guna simpanan tempatan (peranti ini sahaja)";
    return {
        title: JSON.parse(localStorage.getItem("kbttc_undian_title") || "\"\""),
        announcement: JSON.parse(localStorage.getItem("kbttc_undian_announcement") || "\"\""),
        mode: JSON.parse(localStorage.getItem("kbttc_undian_mode") || "\"4\""),
        qualifyCount: JSON.parse(localStorage.getItem("kbttc_undian_qualifycount") || "\"3\""),
        peserta: JSON.parse(localStorage.getItem("kbttc_undian_peserta") || "[]"),
        groups: JSON.parse(localStorage.getItem("kbttc_undian_groups") || "{}"),
        ranks: JSON.parse(localStorage.getItem("kbttc_undian_ranks") || "{}"),
        slotJuara: JSON.parse(localStorage.getItem("kbttc_undian_slotjuara") || "{}"),
        p16draw: JSON.parse(localStorage.getItem("kbttc_undian_p16") || "null"),
        p16full: JSON.parse(localStorage.getItem("kbttc_undian_p16full") || "null"),
        qf2draw: JSON.parse(localStorage.getItem("kbttc_undian_qf2") || "null"),
        matches: JSON.parse(localStorage.getItem("kbttc_undian_matches") || "{}")
    };
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function rankName(g, pos, groups, ranks) {
    if (ranks[g] && groups[g]) {
        let idx = ranks[g][`p${pos}`] - 1;
        if (groups[g][idx]) return groups[g][idx];
    }
    let labels = { 1: "Juara", 2: "Naib Juara", 3: "Tempat Ke-3", 4: "Tempat Ke-4" };
    return `${labels[pos] || ("Tempat Ke-" + pos)} ${g}`;
}

function renderGroups(groups, ranks) {
    let keys = Object.keys(groups);
    if (!keys.length) return null;
    let html = "<div class='group-container'>";
    keys.forEach(g => {
        let r = ranks[g] || null;
        html += `<div class='group-card'><b>Kumpulan ${g}</b><ol class="numbered-list">`;
        groups[g].forEach((p, i) => {
            let pos = i + 1;
            let medalClass = "";
            let medalIcon = "";
            let elimClass = "";
            if (r) {
                if (r.p1 === pos) { medalClass = "medal-1"; medalIcon = "🥇 "; }
                else if (r.p2 === pos) { medalClass = "medal-2"; medalIcon = "🥈 "; }
                else if (r.p3 === pos) { medalClass = "medal-3"; medalIcon = "🥉 "; }
                else if (r.p4 === pos) { medalClass = "medal-4"; medalIcon = "4️⃣ "; }
                else { elimClass = "eliminated"; }
            }
            html += `<li class="${medalClass} ${elimClass}"><span class="pos-badge">${pos}</span><span class="medal-icon">${medalIcon}</span>${escapeHtml(p)}</li>`;
        });
        html += `</ol></div>`;
    });
    html += "</div>";
    return html;
}

function renderSlotJuara(slotJuara, groups, ranks) {
    if (!slotJuara || !Object.keys(slotJuara).length) return null;
    let html = "<ul class='q-list'>";
    ["Q1", "Q2", "Q3", "Q4"].forEach(q => {
        let g = slotJuara[q];
        if (!g) return;
        html += `<li><span><b>${q}</b> — ${escapeHtml(rankName(g, 1, groups, ranks))}</span><span class="q-tag">Kumpulan ${g}</span></li>`;
    });
    html += "</ul>";
    return html;
}

function computeBracketState(p16draw, groups, ranks, matches) {
    let { qSlots, chosenRank2, rank3 } = p16draw;
    let state = { r16: [], qf: [], sf: [] };

    for (let i = 0; i < 4; i++) {
        let sideA = rankName(chosenRank2[i], 2, groups, ranks);
        let sideB = rankName(rank3[i], 3, groups, ranks);
        let pick = matches[`r16-${i}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.r16.push({ sideA, sideB, pick, winnerName, enabled: true });
    }
    for (let i = 0; i < 4; i++) {
        let dep = state.r16[i].winnerName;
        let sideA = dep || `Pemenang Pusingan 16 (Q${i + 1})`;
        let sideB = rankName(qSlots[i], 1, groups, ranks);
        let pick = matches[`qf-${i}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.qf.push({ sideA, sideB, pick, winnerName, enabled: !!dep });
    }
    [[0, 1], [2, 3]].forEach((pair, si) => {
        let depA = state.qf[pair[0]].winnerName;
        let depB = state.qf[pair[1]].winnerName;
        let sideA = depA || `Pemenang Q${pair[0] + 1}`;
        let sideB = depB || `Pemenang Q${pair[1] + 1}`;
        let pick = matches[`sf-${si}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.sf.push({ sideA, sideB, pick, winnerName, enabled: !!depA && !!depB });
    });
    let depA = state.sf[0].winnerName, depB = state.sf[1].winnerName;
    let fSideA = depA || "Pemenang Separuh Akhir 1";
    let fSideB = depB || "Pemenang Separuh Akhir 2";
    let fPick = matches["final"] || "";
    let fWinner = fPick === "A" ? fSideA : (fPick === "B" ? fSideB : null);
    state.final = { sideA: fSideA, sideB: fSideB, pick: fPick, winnerName: fWinner, enabled: !!depA && !!depB };

    return state;
}

// Mod 2 Kumpulan: Suku Akhir terus (silang A/B), tiada Pusingan 16.
function computeBracketState2(qf2draw, groups, ranks, matches) {
    let state = { qf: [], sf: [] };

    qf2draw.pairs.forEach((pair, i) => {
        let sideA = rankName(pair[0].g, pair[0].p, groups, ranks);
        let sideB = rankName(pair[1].g, pair[1].p, groups, ranks);
        let pick = matches[`qf-${i}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.qf.push({ sideA, sideB, pick, winnerName, enabled: true });
    });

    [[0, 1], [2, 3]].forEach((pair, si) => {
        let depA = state.qf[pair[0]].winnerName;
        let depB = state.qf[pair[1]].winnerName;
        let sideA = depA || `Pemenang Suku Akhir ${pair[0] + 1}`;
        let sideB = depB || `Pemenang Suku Akhir ${pair[1] + 1}`;
        let pick = matches[`sf-${si}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.sf.push({ sideA, sideB, pick, winnerName, enabled: !!depA && !!depB });
    });

    let depA = state.sf[0].winnerName, depB = state.sf[1].winnerName;
    let fSideA = depA || "Pemenang Separuh Akhir 1";
    let fSideB = depB || "Pemenang Separuh Akhir 2";
    let fPick = matches["final"] || "";
    let fWinner = fPick === "A" ? fSideA : (fPick === "B" ? fSideB : null);
    state.final = { sideA: fSideA, sideB: fSideB, pick: fPick, winnerName: fWinner, enabled: !!depA && !!depB };

    return state;
}

// Mod 4 Kumpulan, "4 Terbaik": Pusingan 16 PENUH (16 pasukan, tiada bye).
function computeBracketStateFull16(p16full, groups, ranks, matches) {
    let state = { r16: [], qf: [], sf: [] };

    p16full.r16matches.forEach((pair, i) => {
        let sideA = rankName(pair[0].g, pair[0].p, groups, ranks);
        let sideB = rankName(pair[1].g, pair[1].p, groups, ranks);
        let pick = matches[`r16-${i}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.r16.push({ sideA, sideB, pick, winnerName, enabled: true });
    });

    for (let i = 0; i < 4; i++) {
        let depA = state.r16[2 * i].winnerName;
        let depB = state.r16[2 * i + 1].winnerName;
        let sideA = depA || `Pemenang Pusingan 16 (${2 * i + 1})`;
        let sideB = depB || `Pemenang Pusingan 16 (${2 * i + 2})`;
        let pick = matches[`qf-${i}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.qf.push({ sideA, sideB, pick, winnerName, enabled: !!depA && !!depB });
    }

    [[0, 1], [2, 3]].forEach((pair, si) => {
        let depA = state.qf[pair[0]].winnerName;
        let depB = state.qf[pair[1]].winnerName;
        let sideA = depA || `Pemenang Q${pair[0] + 1}`;
        let sideB = depB || `Pemenang Q${pair[1] + 1}`;
        let pick = matches[`sf-${si}`] || "";
        let winnerName = pick === "A" ? sideA : (pick === "B" ? sideB : null);
        state.sf.push({ sideA, sideB, pick, winnerName, enabled: !!depA && !!depB });
    });

    let depA = state.sf[0].winnerName, depB = state.sf[1].winnerName;
    let fSideA = depA || "Pemenang Separuh Akhir 1";
    let fSideB = depB || "Pemenang Separuh Akhir 2";
    let fPick = matches["final"] || "";
    let fWinner = fPick === "A" ? fSideA : (fPick === "B" ? fSideB : null);
    state.final = { sideA: fSideA, sideB: fSideB, pick: fPick, winnerName: fWinner, enabled: !!depA && !!depB };

    return state;
}

function resultLine(m, side) {
    let name = side === "A" ? m.sideA : m.sideB;
    let cls = "result-line";
    let check = "";
    if (!m.enabled) {
        cls += " pending";
    } else if (m.pick === side) {
        cls += " is-winner";
        check = "<span class='win-check'>✔</span>";
    } else if (m.pick && m.pick !== side) {
        cls += " is-loser";
    }
    return `<div class="${cls}">${escapeHtml(name)} ${check}</div>`;
}

function renderTreeMatchesHTML(hasR16, state) {
    let RU = 42, BOX_W = 190, BOX_H = 32, COL_GAP = 60, OFF_Y = 28;
    let cols = hasR16 ? ["r16", "qf", "sf", "final"] : ["qf", "sf", "final"];
    let labels = hasR16
        ? { r16: "Pusingan 16", qf: "Suku akhir", sf: "Separuh akhir", final: "Akhir" }
        : { qf: "Suku akhir", sf: "Separuh akhir", final: "Akhir" };
    let colX = {};
    cols.forEach((c, i) => colX[c] = i * (BOX_W + COL_GAP));

    let r16Y, qfA, qfB;
    if (hasR16) {
        r16Y = [0, 1, 2, 3, 4, 5, 6, 7].map(i => i * RU);
        let r16Out = [0, 1, 2, 3].map(m => (r16Y[2 * m] + r16Y[2 * m + 1]) / 2);
        qfA = r16Out;
        qfB = r16Out.map(y => y + RU);
    } else {
        qfA = [0, 1, 2, 3].map(m => 2 * m * RU);
        qfB = [0, 1, 2, 3].map(m => (2 * m + 1) * RU);
    }
    let qfOut = [0, 1, 2, 3].map(m => (qfA[m] + qfB[m]) / 2);
    let sfA = [qfOut[0], qfOut[2]];
    let sfB = [qfOut[1], qfOut[3]];
    let sfOut = [(sfA[0] + sfB[0]) / 2, (sfA[1] + sfB[1]) / 2];
    let finalA = sfOut[0], finalB = sfOut[1];

    let allY = (hasR16 ? r16Y : qfA.concat(qfB)).concat([finalA, finalB]);
    let maxY = Math.max(...allY);
    let totalW = cols.length * BOX_W + (cols.length - 1) * COL_GAP;
    let totalH = maxY + OFF_Y + BOX_H;

    let boxesHtml = "";
    let linesSvg = "";

    function slotCls(m, side) {
        if (!m.enabled) return "pending";
        if (m.pick === side) return "winner";
        if (m.pick && m.pick !== side) return "loser";
        return "";
    }
    function addBox(col, y, text, cls) {
        boxesHtml += `<div class="tree-box ${cls}" style="left:${colX[col]}px;top:${y + OFF_Y - BOX_H / 2}px" title="${escapeHtml(text)}">${escapeHtml(text)}</div>`;
    }
    function mergeAndConnect(colFrom, colTo, yA, yB, yOut, toY) {
        let x1 = colX[colFrom] + BOX_W;
        let xBar = x1 + COL_GAP / 2;
        let x2 = colX[colTo];
        let a = yA + OFF_Y, b = yB + OFF_Y, o = yOut + OFF_Y, t = toY + OFF_Y;
        linesSvg += `<path class="tree-line" d="M${x1},${a} H${xBar}"/>`;
        linesSvg += `<path class="tree-line" d="M${x1},${b} H${xBar}"/>`;
        linesSvg += `<path class="tree-line" d="M${xBar},${a} V${b}"/>`;
        linesSvg += `<path class="tree-line" d="M${xBar},${o} H${x2}"/>`;
    }

    if (hasR16) {
        for (let m = 0; m < 4; m++) {
            addBox("r16", r16Y[2 * m], state.r16[m].sideA, slotCls(state.r16[m], "A"));
            addBox("r16", r16Y[2 * m + 1], state.r16[m].sideB, slotCls(state.r16[m], "B"));
            let out = (r16Y[2 * m] + r16Y[2 * m + 1]) / 2;
            mergeAndConnect("r16", "qf", r16Y[2 * m], r16Y[2 * m + 1], out, qfA[m]);
        }
    }
    for (let m = 0; m < 4; m++) {
        addBox("qf", qfA[m], state.qf[m].sideA, slotCls(state.qf[m], "A"));
        addBox("qf", qfB[m], state.qf[m].sideB, slotCls(state.qf[m], "B"));
    }
    for (let m = 0; m < 4; m++) {
        let s = Math.floor(m / 2);
        let toY = (m % 2 === 0) ? sfA[s] : sfB[s];
        mergeAndConnect("qf", "sf", qfA[m], qfB[m], qfOut[m], toY);
    }
    for (let s = 0; s < 2; s++) {
        addBox("sf", sfA[s], state.sf[s].sideA, slotCls(state.sf[s], "A"));
        addBox("sf", sfB[s], state.sf[s].sideB, slotCls(state.sf[s], "B"));
        let toY = (s === 0) ? finalA : finalB;
        mergeAndConnect("sf", "final", sfA[s], sfB[s], sfOut[s], toY);
    }
    addBox("final", finalA, state.final.sideA, slotCls(state.final, "A"));
    addBox("final", finalB, state.final.sideB, slotCls(state.final, "B"));

    let labelsHtml = cols.map(c => `<div class="tree-col-label" style="left:${colX[c]}px;width:${BOX_W}px;text-align:center">${labels[c]}</div>`).join("");
    let champHtml = state.final.winnerName
        ? `<div class="champion-banner">🏆 JUARA KEJOHANAN: ${escapeHtml(state.final.winnerName)}</div>`
        : "";

    return `${champHtml}<div class="tree-scroll"><div class="tree-wrap" style="width:${totalW}px;height:${totalH}px">
        ${labelsHtml}
        <svg class="tree-svg" width="${totalW}" height="${totalH}" style="position:absolute;top:0;left:0">${linesSvg}</svg>
        ${boxesHtml}
    </div></div>`;
}

function renderBracket(state) {
    return renderTreeMatchesHTML(true, state);
}

function renderBracket2(state) {
    return renderTreeMatchesHTML(false, state);
}

// Carta pokok untuk "4 Terbaik": Pusingan 16 PENUH (16 kotak, 8 perlawanan)
// -> Suku Akhir -> Separuh Akhir -> Akhir.
function renderTreeMatchesHTML16(state) {
    let RU = 42, BOX_W = 190, BOX_H = 32, COL_GAP = 60, OFF_Y = 28;
    let cols = ["r16", "qf", "sf", "final"];
    let labels = { r16: "Pusingan 16", qf: "Suku akhir", sf: "Separuh akhir", final: "Akhir" };
    let colX = {};
    cols.forEach((c, i) => colX[c] = i * (BOX_W + COL_GAP));

    let r16Y = Array.from({ length: 16 }, (_, i) => i * RU);
    function matchOut(m) { return (r16Y[2 * m] + r16Y[2 * m + 1]) / 2; }
    let qfA = [0, 1, 2, 3].map(i => matchOut(2 * i));
    let qfB = [0, 1, 2, 3].map(i => matchOut(2 * i + 1));
    let qfOut = [0, 1, 2, 3].map(i => (qfA[i] + qfB[i]) / 2);
    let sfA = [qfOut[0], qfOut[2]];
    let sfB = [qfOut[1], qfOut[3]];
    let sfOut = [(sfA[0] + sfB[0]) / 2, (sfA[1] + sfB[1]) / 2];
    let finalA = sfOut[0], finalB = sfOut[1];

    let maxY = Math.max(...r16Y, finalA, finalB);
    let totalW = cols.length * BOX_W + (cols.length - 1) * COL_GAP;
    let totalH = maxY + OFF_Y + BOX_H;

    let boxesHtml = "";
    let linesSvg = "";

    function slotCls(m, side) {
        if (!m.enabled) return "pending";
        if (m.pick === side) return "winner";
        if (m.pick && m.pick !== side) return "loser";
        return "";
    }
    function addBox(col, y, text, cls) {
        boxesHtml += `<div class="tree-box ${cls}" style="left:${colX[col]}px;top:${y + OFF_Y - BOX_H / 2}px" title="${escapeHtml(text)}">${escapeHtml(text)}</div>`;
    }
    function mergeAndConnect(colFrom, colTo, yA, yB, yOut) {
        let x1 = colX[colFrom] + BOX_W;
        let xBar = x1 + COL_GAP / 2;
        let x2 = colX[colTo];
        let a = yA + OFF_Y, b = yB + OFF_Y, o = yOut + OFF_Y;
        linesSvg += `<path class="tree-line" d="M${x1},${a} H${xBar}"/>`;
        linesSvg += `<path class="tree-line" d="M${x1},${b} H${xBar}"/>`;
        linesSvg += `<path class="tree-line" d="M${xBar},${a} V${b}"/>`;
        linesSvg += `<path class="tree-line" d="M${xBar},${o} H${x2}"/>`;
    }

    for (let m = 0; m < 8; m++) {
        addBox("r16", r16Y[2 * m], state.r16[m].sideA, slotCls(state.r16[m], "A"));
        addBox("r16", r16Y[2 * m + 1], state.r16[m].sideB, slotCls(state.r16[m], "B"));
        mergeAndConnect("r16", "qf", r16Y[2 * m], r16Y[2 * m + 1], matchOut(m));
    }
    for (let i = 0; i < 4; i++) {
        addBox("qf", qfA[i], state.qf[i].sideA, slotCls(state.qf[i], "A"));
        addBox("qf", qfB[i], state.qf[i].sideB, slotCls(state.qf[i], "B"));
        mergeAndConnect("qf", "sf", qfA[i], qfB[i], qfOut[i]);
    }
    for (let s = 0; s < 2; s++) {
        addBox("sf", sfA[s], state.sf[s].sideA, slotCls(state.sf[s], "A"));
        addBox("sf", sfB[s], state.sf[s].sideB, slotCls(state.sf[s], "B"));
        mergeAndConnect("sf", "final", sfA[s], sfB[s], sfOut[s]);
    }
    addBox("final", finalA, state.final.sideA, slotCls(state.final, "A"));
    addBox("final", finalB, state.final.sideB, slotCls(state.final, "B"));

    let labelsHtml = cols.map(c => `<div class="tree-col-label" style="left:${colX[c]}px;width:${BOX_W}px;text-align:center">${labels[c]}</div>`).join("");
    let champHtml = state.final.winnerName
        ? `<div class="champion-banner">🏆 JUARA KEJOHANAN: ${escapeHtml(state.final.winnerName)}</div>`
        : "";

    return `${champHtml}<div class="tree-scroll"><div class="tree-wrap" style="width:${totalW}px;height:${totalH}px">
        ${labelsHtml}
        <svg class="tree-svg" width="${totalW}" height="${totalH}" style="position:absolute;top:0;left:0">${linesSvg}</svg>
        ${boxesHtml}
    </div></div>`;
}

function renderBracket16(state) {
    return renderTreeMatchesHTML16(state);
}

function renderPeserta(peserta) {
    if (!peserta || !peserta.length) return null;
    let html = `<p style="margin:0 0 10px;color:var(--muted);font-size:13px;">Jumlah peserta didaftarkan: <b>${peserta.length}</b></p><div class="peserta-grid">`;
    peserta.forEach((p, i) => {
        html += `<div class="peserta-card"><span class="peserta-num">${i + 1}.</span>${escapeHtml(p)}</div>`;
    });
    html += "</div>";
    return html;
}

let lastTickerText = null;

function updateTicker(text) {
    let wrap = document.getElementById("tickerWrap");
    let track = document.getElementById("tickerTrack");
    let clean = (text || "").trim();

    if (!clean) {
        wrap.style.display = "none";
        document.body.classList.remove("has-ticker");
        lastTickerText = null;
        return;
    }

    wrap.style.display = "flex";
    document.body.classList.add("has-ticker");

    // Elak "reset" animasi berulang setiap 6 saat (poll interval) kalau
    // teks pesanan tidak berubah — hanya update DOM bila teks berlainan.
    if (clean !== lastTickerText) {
        track.innerText = clean;
        // Kelajuan skrol disesuaikan ikut panjang teks supaya senang dibaca.
        let duration = Math.max(12, clean.length * 0.22);
        track.style.animationDuration = duration + "s";
        lastTickerText = clean;
    }
}

async function renderAll() {
    let { title, announcement, mode, qualifyCount, peserta, groups, ranks, slotJuara, p16draw, p16full, qf2draw, matches } = await fetchState();

    document.getElementById("mainTitle").innerText = (title && title.trim()) ? title : "🏓 Keputusan & Carta Kejohanan";

    updateTicker(announcement);

    let hasGroups = groups && Object.keys(groups).length > 0;
    let hasSlot = mode !== "2" && qualifyCount !== "4" && slotJuara && Object.keys(slotJuara).length > 0;
    let hasBracket4 = mode !== "2" && qualifyCount !== "4" && !!p16draw;
    let hasBracket16 = mode !== "2" && qualifyCount === "4" && !!p16full;
    let hasBracket2 = mode === "2" && !!qf2draw;

    // Peserta panel hanya nampak SEBELUM undian kumpulan dijalankan —
    // sebaik sahaja ada groups, senarai kumpulan yang lebih terperinci
    // mengambil alih peranan ini.
    let pesertaPanel = document.getElementById("pesertaPanel");
    if (peserta && peserta.length && !hasGroups) {
        pesertaPanel.style.display = "block";
        document.getElementById("pesertaArea").innerHTML = renderPeserta(peserta) || "<div class='empty-msg'>Tiada peserta didaftarkan.</div>";
    } else {
        pesertaPanel.style.display = "none";
    }

    // Setiap panel peringkat seterusnya hanya didedahkan selepas admin
    // tekan butang undian berkaitan di undi.html (iaitu bila data wujud).
    let groupPanel = document.getElementById("groupPanel");
    if (hasGroups) {
        groupPanel.style.display = "block";
        document.getElementById("groupArea").innerHTML = renderGroups(groups, ranks) || "";
    } else {
        groupPanel.style.display = "none";
    }

    // Panel "Penempatan Juara ke Suku Akhir" cuma relevan untuk mod 4 Kumpulan.
    let slotPanel = document.getElementById("slotPanel");
    if (hasSlot) {
        slotPanel.style.display = "block";
        document.getElementById("slotArea").innerHTML = renderSlotJuara(slotJuara, groups, ranks) || "";
    } else {
        slotPanel.style.display = "none";
    }

    let bracketPanel = document.getElementById("bracketPanel");
    if (hasBracket4) {
        bracketPanel.style.display = "block";
        let state = computeBracketState(p16draw, groups, ranks, matches);
        document.getElementById("bracketArea").innerHTML = renderBracket(state);
    } else if (hasBracket16) {
        bracketPanel.style.display = "block";
        let state = computeBracketStateFull16(p16full, groups, ranks, matches);
        document.getElementById("bracketArea").innerHTML = renderBracket16(state);
    } else if (hasBracket2) {
        bracketPanel.style.display = "block";
        let state = computeBracketState2(qf2draw, groups, ranks, matches);
        document.getElementById("bracketArea").innerHTML = renderBracket2(state);
    } else {
        bracketPanel.style.display = "none";
    }

    document.getElementById("updatedTxt").innerText = "Dikemaskini: " + new Date().toLocaleTimeString("ms-MY");
}

renderAll();
setInterval(renderAll, 6000);
</script>
